<!doctype html>
<html lang="{{ site.lang | default: 'fa' }}" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0d12">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <div class="site-shell">
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}"><span class="brand-mark">و</span><span>{{ site.title }}</span></a>
      <nav class="nav-links" aria-label="ناوبری اصلی">
        <a href="{{ '/' | relative_url }}">خانه</a>
        <a href="{{ '/#about' | relative_url }}">درباره وبلاگ</a>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="تغییر حالت رنگ">◐</button>
      </nav>
    </header>
    <main id="main-content">{{ content }}</main>
    <footer class="site-footer">
      <span>ساخته‌شده با کنجکاوی و کمی کد ✦</span>
      <span>© {{ site.time | date: '%Y' }} · {{ site.title }}</span>
    </footer>
  </div>
  <script src="{{ '/assets/js/theme.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/blog.js' | relative_url }}" defer></script>
</body>
</html>
